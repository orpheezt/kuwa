[project]
name = "kuwahara"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyperf>=2.10.0",
    "typer>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.65",
]
